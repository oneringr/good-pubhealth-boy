<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Good Pubhealth Boy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Good Pubhealth Boy</h1>
      <p class="intro">虚拟仿真实验平台自动登录</p>
      <form id="login-form">
        <label for="username">账号</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button class="primary" type="submit">保存并登录</button>
      </form>
      <button id="clear" class="secondary" type="button">清除保存的账号密码</button>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="hint">保存后，以后打开网站也会自动登录。账号密码只保存在此浏览器的扩展存储中。</p>
    </main>
    <script src="popup.js" defer></script>
  </body>
</html>
